<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Outstanding Crossdocking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2FA;--surface:#ffffff;--ink:#27233A;--muted:#6D6886;--line:#E7E3F4;
  --pri:#6B5BD6;--pri-d:#5343BE;--pri-s:#EAE5FC;
  --mint:#D4F3E5;--mint-i:#186845;--peach:#FFE2D1;--peach-i:#98491C;
  --sky:#D5ECFC;--sky-i:#21578A;--rose:#FCD8E6;--rose-i:#9D2B5B;--butter:#FFF0C2;--butter-i:#7B5B04;
  --side:#ECE8FA;--r:18px;--sh:0 8px 28px rgba(107,91,214,.09)
}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none}

#topprog{position:fixed;top:0;left:0;right:0;height:3px;z-index:200;pointer-events:none;opacity:0;transition:opacity .25s}
#topprog.on{opacity:1}
#topprog i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--pri),#34B38A,#F06B9A,var(--pri));background-size:200% 100%;animation:tprog 1s linear infinite}
@keyframes tprog{to{background-position:-200% 0}}

.blobs{position:fixed;inset:0;overflow:hidden;pointer-events:none!important;z-index:0}
.blobs i{position:absolute;border-radius:50%;filter:blur(65px);opacity:.65;pointer-events:none!important;animation:drift 16s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:420px;height:420px;background:#E2DAFC;top:-90px;right:-70px}
.blobs i:nth-child(2){width:360px;height:360px;background:#CCF2E0;bottom:-70px;left:22%;animation-delay:-6s}
.blobs i:nth-child(3){width:300px;height:300px;background:#FCD4E6;top:35%;right:15%;animation-delay:-12s}
.blobs i:nth-child(4){width:260px;height:260px;background:#FFEEB8;top:14%;left:8%;animation-delay:-4s;opacity:.5}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-40px) scale(1.14)}100%{transform:translate(-35px,45px) scale(.92)}}

/* ================= ANIMASI BACKGROUND LOGISTIK BONGKAR MUAT (HALAMAN LOGIN) ================= */
#logi-bg{display:none;position:fixed;inset:0;pointer-events:none!important;z-index:1;overflow:hidden}
body.landing #logi-bg{display:block}
#logi-bg svg{width:100%;height:100%;object-fit:cover}
.lg-cloud1{animation:lgCloud 38s linear infinite}
.lg-cloud2{animation:lgCloud 52s linear infinite reverse}
@keyframes lgCloud{from{transform:translateX(-250px)}to{transform:translateX(1450px)}}
.lg-ship{animation:lgShip 7s ease-in-out infinite}
@keyframes lgShip{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-6px) rotate(.6deg)}}
.lg-trolley{animation:lgTrolley 9s ease-in-out infinite}
@keyframes lgTrolley{
  0%,100%{transform:translateX(0)}
  40%,60%{transform:translateX(145px)}
}
.lg-cable{animation:lgCable 9s ease-in-out infinite;transform-origin:top}
@keyframes lgCable{
  0%,100%{transform:scaleY(1)}
  20%{transform:scaleY(1.45)}
  40%{transform:scaleY(.85)}
  60%{transform:scaleY(1.35)}
  80%{transform:scaleY(.9)}
}
.lg-hoist-box{animation:lgHoist 9s ease-in-out infinite}
@keyframes lgHoist{
  0%,100%{transform:translateY(0)}
  20%{transform:translateY(42px)}
  40%{transform:translateY(-14px)}
  60%{transform:translateY(32px)}
  80%{transform:translateY(-8px)}
}
.lg-truck1{animation:lgTruck1 15s linear infinite}
@keyframes lgTruck1{0%{transform:translateX(-320px)}100%{transform:translateX(1650px)}}
.lg-truck2{animation:lgTruck2 20s linear infinite}
@keyframes lgTruck2{0%{transform:translateX(1600px)}100%{transform:translateX(-350px)}}
.lg-forklift{animation:lgFork 11s ease-in-out infinite}
@keyframes lgFork{
  0%,100%{transform:translateX(0)}
  45%,55%{transform:translateX(160px)}
}
.lg-fork-arm{animation:lgForkArm 11s ease-in-out infinite}
@keyframes lgForkArm{
  0%,35%,100%{transform:translateY(0)}
  45%,65%{transform:translateY(-18px)}
}

/* ================= ANIMASI HEADER DASHBOARD PUBLIK (FULL-WIDTH LEADER & PETUGAS) ================= */
.pub-hero{background:#fff;border-radius:24px;border:1.5px solid var(--line);box-shadow:0 12px 34px rgba(37,99,235,.08);overflow:hidden;margin-bottom:20px}
.pub-hero-top{display:flex;justify-content:space-between;align-items:center;padding:18px 26px;gap:16px;flex-wrap:wrap;background:#fff;border-bottom:1px solid #E2E8F0}
.ph-brand{display:flex;align-items:center;gap:16px}
.ph-cicon{width:58px;height:40px;border-radius:7px;background:linear-gradient(180deg,#2563EB,#1D4ED8);border:2.5px solid #1E40AF;display:flex;justify-content:space-evenly;align-items:center;padding:4px 6px;box-shadow:0 6px 14px rgba(37,99,235,.28);position:relative;animation:floaty 3.5s ease-in-out infinite}
.ph-cicon i{width:3px;height:82%;background:rgba(255,255,255,.55);border-radius:2px}
.ph-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph-title-row h1{margin:0;font-size:25px;font-weight:900;letter-spacing:.4px;background:linear-gradient(90deg,#1D4ED8,#0D9488);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ph-live{display:inline-flex;align-items:center;gap:6px;background:#DCFCE7;color:#15803D;border:1.5px solid #86EFAC;padding:3px 12px;border-radius:99px;font-size:11.5px;font-weight:900;letter-spacing:.6px}
.ph-live b{width:7px;height:7px;border-radius:50%;background:#22C55E;display:inline-block;animation:pulse 1.5s infinite}
.ph-sub{margin:2px 0 0;color:#64748B;font-size:13px;font-weight:700}
.ph-time{text-align:right;margin-left:auto}
.ph-clock{font-size:28px;font-weight:900;color:#0F172A;letter-spacing:1px;line-height:1.1;font-variant-numeric:tabular-nums}
.ph-upd{font-size:12px;color:#64748B;font-weight:700;margin-top:3px}

/* Panggung Ilustrasi Full-Width (Gaya Flat Vector Rapi) */
.pub-scene{width:100%;height:230px;position:relative;overflow:hidden;background:linear-gradient(180deg,#8EC5FC 0%,#CBEAFE 68%,#E2E8F0 68%,#CBD5E1 100%)}
.pub-scene svg{width:100%;height:100%;display:block}
.ps-sun{animation:psSun 4s ease-in-out infinite;transform-origin:110px 52px}
@keyframes psSun{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.12);opacity:1}}
.ps-cloudA{animation:psCloudA 38s linear infinite}
.ps-cloudB{animation:psCloudB 48s linear infinite}
@keyframes psCloudA{from{transform:translateX(-200px)}to{transform:translateX(1250px)}}
@keyframes psCloudB{from{transform:translateX(1250px)}to{transform:translateX(-220px)}}

/* Animasi Karakter Leader (Helm Putih) & Anak Buah (Helm Kuning) */
.ld-head{transform-origin:490px 84px;animation:ldHead 1.6s ease-in-out infinite}
@keyframes ldHead{0%,100%{transform:rotate(0deg) translateY(0)}50%{transform:rotate(3deg) translateY(-2px)}}
.ld-arm-r{transform-origin:512px 118px;animation:ldPoint 1.6s ease-in-out infinite}
@keyframes ldPoint{0%,100%{transform:rotate(0deg)}45%,65%{transform:rotate(-26deg)}}
.ld-clip{transform-origin:462px 124px;animation:ldClip 1.6s ease-in-out infinite}
@keyframes ldClip{0%,100%{transform:rotate(0deg)}50%{transform:rotate(5deg)}}

.wk-upper{transform-origin:710px 150px;animation:wkNod 1.6s ease-in-out infinite}
@keyframes wkNod{0%,100%{transform:rotate(0deg) translateY(0)}50%{transform:rotate(-5deg) translateY(2px)}}
.wk-head{transform-origin:710px 88px;animation:wkHeadNod 0.8s ease-in-out infinite}
@keyframes wkHeadNod{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-8deg) translateY(2px)}}
.wk-salute{transform-origin:688px 118px;animation:wkSalute 1.6s ease-in-out infinite}
@keyframes wkSalute{0%,100%{transform:rotate(0deg)}45%,65%{transform:rotate(28deg)}}
.wk-box{transform-origin:735px 136px;animation:wkBox 1.6s ease-in-out infinite}
@keyframes wkBox{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.bub-job{transform-origin:585px 52px;animation:bubJob 3.2s ease-in-out infinite}
@keyframes bubJob{0%,45%,100%{transform:scale(1) translateY(0);opacity:1}55%,90%{transform:scale(.88) translateY(4px);opacity:.45}}
.bub-siap{transform-origin:635px 52px;animation:bubSiap 3.2s ease-in-out infinite}
@keyframes bubSiap{0%,45%,100%{transform:scale(.88) translateY(4px);opacity:.45}55%,95%{transform:scale(1.04) translateY(0);opacity:1}}

#app{display:flex;min-height:100vh;position:relative;z-index:5}
aside{width:255px;background:rgba(236,232,250,.92);backdrop-filter:blur(14px);padding:20px 14px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;height:100vh;transition:transform .32s cubic-bezier(.2,.9,.3,1);z-index:30;border-right:1px solid var(--line)}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 16px}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--pri),#8F7FF3);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;letter-spacing:-.3px;box-shadow:0 6px 16px rgba(107,91,214,.35);animation:floaty 3.6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-4deg)}}
.brand b{display:block;font-size:15px;font-weight:800;line-height:1.2}.brand small{color:var(--muted);font-size:11.5px;font-weight:600}

nav{display:flex;flex-direction:column;gap:5px;flex:1;overflow:auto;padding:2px}
.nv{display:flex;gap:11px;align-items:center;padding:11px 13px;border-radius:13px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:700;text-align:left;position:relative;transition:background .22s,color .22s,transform .22s}
.nv:hover{background:rgba(255,255,255,.72);color:var(--ink);transform:translateX(4px)}
.nv.on{background:#fff;color:var(--pri);box-shadow:var(--sh);transform:translateX(3px)}
.nv:before{content:'';position:absolute;left:-14px;top:50%;width:5px;height:0;border-radius:0 6px 6px 0;background:var(--pri);transform:translateY(-50%);transition:height .28s}
.nv.on:before{height:26px}

.ubox{background:#fff;border-radius:15px;padding:12px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 16px rgba(107,91,214,.06);border:1px solid var(--line)}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pri-s),#D5CEFA);color:var(--pri-d);display:grid;place-items:center;font-weight:900}
.ubox small{color:var(--muted);display:block;font-size:11px;font-weight:600}

main{flex:1;min-width:0;padding:22px 28px 80px;position:relative;z-index:5}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h2{margin:0;font-size:20px;font-weight:800;flex:1;min-width:200px}.top small{color:var(--muted);font-weight:600;display:block;font-size:12px}
.ib{border:0;background:#fff;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;cursor:pointer;position:relative;box-shadow:var(--sh);transition:transform .25s,box-shadow .25s}
.ib:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(107,91,214,.18)}
.ib .dot{position:absolute;top:-4px;right:-4px;background:var(--rose-i);color:#fff;border-radius:99px;font-size:10px;min-width:19px;height:19px;display:grid;place-items:center;font-weight:800;animation:pulse 1.8s infinite}
#burger{display:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(157,43,91,.4)}50%{box-shadow:0 0 0 7px rgba(157,43,91,0)}}

body.landing aside, body.landing .top{display:none!important}
body.landing main{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
body.landing #view{width:100%;max-width:460px}
body.landing .card{background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border:1.5px solid rgba(255,255,255,.8);box-shadow:0 20px 50px rgba(39,35,58,.15)}
.hero-login{text-align:center;margin-bottom:20px;background:rgba(255,255,255,.78);backdrop-filter:blur(10px);padding:18px 20px;border-radius:22px;border:1px solid rgba(255,255,255,.85);box-shadow:0 10px 30px rgba(107,91,214,.1)}
.hero-logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--pri),#8F7FF3);color:#fff;display:grid;place-items:center;font-weight:900;font-size:25px;margin:0 auto 10px;box-shadow:0 12px 28px rgba(107,91,214,.38);animation:floaty 3.4s ease-in-out infinite}
.hero-login h1{margin:0 0 4px;font-size:24px;font-weight:900;color:var(--ink)}
.hero-login p{margin:0;color:var(--muted);font-weight:700;font-size:13px}
.or-sep{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--muted);font-size:12px;font-weight:700}
.or-sep:before,.or-sep:after{content:'';flex:1;height:1px;background:var(--line)}

.page-enter{animation:pgin .3s ease both}
@keyframes pgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rv{animation:rise .4s ease backwards;animation-delay:calc(var(--i,0)*40ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.ra{animation:rowin .25s ease backwards;animation-delay:calc(var(--r,0)*20ms)}
@keyframes rowin{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.sk{border-radius:var(--r);min-height:90px;background:linear-gradient(90deg,#EFEBFA 25%,#F8F6FD 50%,#EFEBFA 75%);background-size:200% 100%;animation:shim 1.3s infinite}
@keyframes shim{to{background-position:-200% 0}}

.head h1{margin:0 0 2px;font-size:23px;font-weight:900}.sub{margin:0 0 18px;color:var(--muted);font-weight:600}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:18px;border:1px solid var(--line);transition:box-shadow .25s}
.card:hover{box-shadow:0 14px 36px rgba(107,91,214,.13)}
.card h3{margin:0 0 12px;font-size:15px;font-weight:800}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin-bottom:18px}
.st{border-radius:var(--r);padding:17px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}
.st:hover{transform:translateY(-5px);box-shadow:0 14px 28px rgba(43,39,64,.12)}
.st span{font-size:12px;font-weight:700;opacity:.88}.st b{font-size:32px;line-height:1.1;font-weight:900}.st small{font-size:11.5px;opacity:.82;font-weight:600}
.c-sky{background:var(--sky);color:var(--sky-i)}.c-mint{background:var(--mint);color:var(--mint-i)}.c-peach{background:var(--peach);color:var(--peach-i)}.c-lilac{background:var(--pri-s);color:var(--pri-d)}.c-rose{background:var(--rose);color:var(--rose-i)}.c-butter{background:var(--butter);color:var(--butter-i)}

.pbar{height:15px;background:var(--pri-s);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background-color:var(--mint-i);background-image:linear-gradient(45deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 75%,transparent 75%);background-size:22px 22px;border-radius:99px;transition:width .7s ease;animation:stripe 1s linear infinite}
@keyframes stripe{to{background-position:22px 0}}
.prow{display:flex;justify-content:space-between;margin-bottom:8px;font-weight:800}

.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-bottom:18px}
.g3 .card{margin:0}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
label.f i.opt{font-style:normal;font-weight:600;color:#9B96B2;font-size:11px}
input,select,textarea{background:#FBFAFE;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-s)}
textarea{resize:vertical;min-height:72px}

.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;background:var(--pri);color:#fff;position:relative;overflow:hidden;transition:background .2s,transform .15s,box-shadow .2s;display:inline-flex;gap:8px;align-items:center;justify-content:center;user-select:none}
.btn:hover{background:var(--pri-d);transform:translateY(-2px);box-shadow:0 6px 18px rgba(107,91,214,.28)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.soft{background:var(--pri-s);color:var(--pri-d)}.btn.soft:hover{background:#DAD3F8}
.btn.red{background:var(--rose);color:var(--rose-i)}.btn.red:hover{background:#F7C2D8}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:10px}

.tw{overflow-x:auto;border-radius:13px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;min-width:760px}
th{background:#F7F5FD;text-align:left;padding:11px 12px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;user-select:none;font-weight:800}
th:hover{background:#EFEBF9;color:var(--pri)}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:#F8F6FF}

.pg{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;font-weight:700}
.pg div{display:flex;gap:6px}
.bdg{display:inline-block;padding:3.5px 10px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap}
.b-Belum{background:var(--peach);color:var(--peach-i)}
.b-On,.b-Dikerjakan{background:var(--sky);color:var(--sky-i)}
.b-Selesai{background:var(--mint);color:var(--mint-i)}
.b-URGENT{background:var(--butter);color:var(--butter-i)}
.b-TERLAMBAT{background:var(--rose);color:var(--rose-i)}
.empty{text-align:center;color:var(--muted);padding:28px;font-weight:600}

.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut svg{width:150px;height:150px;transform:rotate(-90deg)}.donut circle{fill:none;stroke-width:18;transition:stroke-dasharray .8s ease}
.lg{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600}.lg i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:6px}
.hb{display:flex;flex-direction:column;gap:10px}.hb div small{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:3px;font-weight:700}
.hb .tr{height:10px;background:var(--pri-s);border-radius:99px;overflow:hidden}.hb .tr i{display:block;height:100%;width:0;background:var(--pri);border-radius:99px;transition:width .7s ease}
.hb .tr i b{display:block;height:100%;background:var(--mint-i);border-radius:99px}
.tn{display:flex;gap:8px;align-items:flex-end;height:140px}
.tn>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.tn .bs{display:flex;gap:3px;align-items:flex-end;height:100px}.tn .bs i{width:11px;border-radius:5px 5px 0 0;height:0;transition:height .7s ease}
.tn small{font-size:10px;color:var(--muted);font-weight:700}

.hist{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.hi{display:flex;gap:10px;padding-left:4px}.hi:before{content:'';width:10px;height:10px;border-radius:50%;background:var(--pri);margin-top:6px;flex:none}
.hi small{color:var(--muted);display:block;font-weight:600}
.alert{background:var(--butter);color:var(--butter-i);border-radius:14px;padding:12px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:center;font-weight:700}
.alert.red{background:var(--rose);color:var(--rose-i)}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.form .w{grid-column:1/-1}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.job{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:17px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh);transition:transform .25s,box-shadow .25s}
.job:hover{transform:translateY(-5px);box-shadow:0 16px 34px rgba(107,91,214,.16)}
.job.u1{border-left:6px solid #E8B93B}.job.u2{border-left:6px solid #E0709F}
.job h4{margin:0;font-size:16px;display:flex;justify-content:space-between;gap:8px;font-weight:800}.job p{margin:0;color:var(--muted);font-size:13px;font-weight:600}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:700;color:var(--muted);transition:all .2s}
.chip:hover{border-color:var(--pri);color:var(--pri)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}

#modal{position:fixed;inset:0;background:rgba(39,35,58,.38);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
#modal.on{display:flex}
.mb{background:#fff;border-radius:22px;padding:22px;width:100%;max-width:640px;max-height:92vh;overflow:auto;box-shadow:0 24px 64px rgba(39,35,58,.28)}
.mb h3{margin:0 0 14px;font-size:18px;font-weight:800}.ma{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

#toasts{position:fixed;left:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:95}
.ts{background:#fff;border-left:5px solid var(--mint-i);padding:12px 16px;border-radius:13px;box-shadow:0 10px 30px rgba(43,39,64,.18);max-width:350px;font-weight:700}
.ts.err{border-color:var(--rose-i)}

.ck{display:flex;flex-wrap:wrap;gap:8px}.ck label{display:flex;gap:6px;align-items:center;background:#FBFAFE;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:13px;font-weight:600}.ck input{width:auto}
.mut{color:var(--muted)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.sb{justify-content:space-between}

/* FLOATING CS CHAT BUBBLE */
#cw{position:fixed;right:22px;bottom:22px;z-index:55}
#ctip{position:absolute;right:74px;bottom:10px;background:#fff;color:var(--ink);padding:10px 15px;border-radius:16px 16px 4px 16px;box-shadow:0 10px 28px rgba(43,39,64,.16);border:1px solid var(--line);white-space:nowrap;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
#ctip i{width:8px;height:8px;border-radius:50%;background:#32B67A;display:inline-block}
#ctip b{color:var(--pri)}
#ctip .tx{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 0 0 4px;font-size:15px}
#cw.open #ctip{display:none!important}

#cfab{width:62px;height:62px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--pri),#8A7AEF);color:#fff;display:grid;place-items:center;cursor:pointer;position:relative;box-shadow:0 12px 30px rgba(107,91,214,.45)}
#cfab svg{width:27px;height:27px}
.cb{position:absolute;top:-3px;right:-3px;min-width:22px;height:22px;border-radius:99px;background:var(--rose-i);color:#fff;font-size:11px;font-weight:800;display:none;place-items:center;border:2px solid #fff}

#cpanel{position:absolute;right:0;bottom:76px;width:385px;max-width:calc(100vw - 28px);height:540px;max-height:calc(100vh - 110px);background:#fff;border-radius:24px;box-shadow:0 24px 68px rgba(39,35,58,.28);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom right;transform:scale(.6) translateY(30px);opacity:0;pointer-events:none;transition:transform .3s ease,opacity .2s}
#cw.open #cpanel{transform:none;opacity:1;pointer-events:auto}

.chd{display:flex;gap:10px;align-items:center;padding:14px 16px;background:linear-gradient(135deg,var(--pri),#7E6EEB);color:#fff}
.chd .ib{box-shadow:none;width:32px;height:32px;background:rgba(255,255,255,.18);color:#fff;border-radius:10px}
.ca{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--pri);display:grid;place-items:center;font-weight:900;font-size:14px}
.chi{flex:1;min-width:0}.chi b{display:block;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chi small{color:rgba(255,255,255,.9);display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600}
.chi small i{width:8px;height:8px;border-radius:50%;background:#67F2A7;display:inline-block}

#cmsgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:9px;background:#F8F7FC}
.cm{max-width:85%;padding:10px 14px;border-radius:17px;white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.45;box-shadow:0 2px 8px rgba(43,39,64,.05)}
.cm small{display:block;font-size:10.5px;opacity:.78;margin-bottom:3px;font-weight:800}
.cm.in{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.cm.out{background:linear-gradient(135deg,var(--pri),#7C6CE9);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.cm.stf{background:var(--mint);color:var(--mint-i);align-self:flex-start;border-bottom-left-radius:4px}
.cm.pend{opacity:.65}.cm.fail{background:var(--rose);color:var(--rose-i)}
.cm.typing{display:flex;gap:5px;padding:12px 15px;width:fit-content}.cm.typing i{width:7px;height:7px;border-radius:50%;background:#A59CD6;animation:dot .9s infinite}
.cm.typing i:nth-child(2){animation-delay:.15s}.cm.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}

.crooms{display:flex;flex-direction:column;gap:8px}
.croom{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px 13px;cursor:pointer;display:flex;gap:10px;align-items:center}
.croom:hover{border-color:var(--pri)}
.croom.unr{background:#F3F0FF;border-color:#C6BBF7}
.croom .av{width:38px;height:38px;font-size:14px;flex:none}
.croom .rm-b{flex:1;min-width:0}
.croom .rm-t{display:flex;justify-content:space-between;gap:6px;align-items:center}
.croom .rm-t b{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.croom .rm-t time{font-size:10.5px;color:var(--muted);font-weight:700}
.croom .rm-s{font-size:11.5px;color:var(--pri-d);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.croom .rm-m{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.croom .udot{width:10px;height:10px;border-radius:50%;background:var(--rose-i);flex:none}

#cqr{display:none;flex-wrap:wrap;gap:6px;padding:9px 12px;background:#F8F7FC;border-top:1px solid var(--line);max-height:115px;overflow:auto}
.cin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#fff}.cin .btn{padding:0 14px}

#fx{position:fixed;inset:0;pointer-events:none!important;z-index:120}

@media(max-width:900px){
  aside{position:fixed;left:0;transform:translateX(-105%);box-shadow:8px 0 30px rgba(43,39,64,.18)}
  body.open aside{transform:none}
  #burger{display:grid}
  main{padding:16px 14px 80px}
  #ctip{display:none!important}
  .safety-gif{width:100%}
}

/* ===== Input Excel & daftar kontainer ===== */
.seg{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 16px;font-weight:800;color:var(--muted);cursor:pointer;transition:all .2s}
.seg button.on{background:var(--pri);color:#fff;box-shadow:0 4px 12px rgba(107,91,214,.25)}
.dz{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px dashed #CFC8EE;border-radius:16px;padding:26px 16px;cursor:pointer;background:#FBFAFF;color:var(--muted);font-weight:700;transition:all .2s;margin-top:14px}
.dz:hover,.dz.over{border-color:var(--pri);background:var(--pri-s);color:var(--pri-d)}
.dz b{color:var(--ink);font-size:15px}.dz small{font-weight:600}
.xsteps{margin:8px 0 12px;padding-left:20px;color:var(--muted);font-weight:600}.xsteps li{margin-bottom:2px}
.xsum{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
.xsum span{background:var(--pri-s);color:var(--pri-d);border-radius:99px;padding:5px 13px;font-weight:700;font-size:12px}
.xsum span.bad{background:var(--rose);color:var(--rose-i)}.xsum span.good{background:var(--mint);color:var(--mint-i)}
.xerr{max-height:240px;overflow:auto;margin:0 0 10px;padding:12px 14px 12px 30px;background:#FFF5F9;border:1px solid var(--rose);border-radius:14px;color:var(--rose-i);font-weight:600;font-size:13px}
.xlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;max-height:440px;overflow:auto;padding:2px}
.xg{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;display:flex;flex-direction:column;gap:6px}
.xg h4{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:8px;font-weight:800}
.xg p{margin:0;font-size:12px;color:var(--muted);font-weight:600}
.xch{display:flex;flex-wrap:wrap;gap:5px}
.xch i{font-style:normal;background:var(--sky);color:var(--sky-i);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:800}
.pbar{height:8px;background:#EDE9FA;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#45B884,#34B38A);border-radius:99px;transition:width .35s}
.job.clk{cursor:pointer}
.pg2{display:flex;flex-direction:column;gap:4px}
.pg2 small{color:var(--muted);font-weight:700;font-size:12px;display:flex;justify-content:space-between}
.ctl{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;margin-top:12px;padding-right:2px}
.cti{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer;background:#fff;transition:all .2s}
.cti:hover{border-color:var(--pri)}
.cti.on{background:#F1FBF6;border-color:#BFE8D3}
.cti input{width:20px;height:20px;accent-color:#34B38A;flex:none;cursor:pointer}

.cti.on b{text-decoration:line-through;text-decoration-color:#8AD1B1}
.cti small{display:block;color:var(--muted);font-weight:600;font-size:11px}

.ctb{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:3px 11px;font-weight:800;font-size:12px;color:var(--pri-d);cursor:pointer;white-space:nowrap}
.ctb:hover{border-color:var(--pri);background:var(--pri-s)}
</style>

function call(a,p,pub,silent){
  if(!silent)prog(true);
  return new Promise(function(ok,no){
    if(typeof google==='undefined'||!google.script){
      if(!silent)prog(false);
      return no(new Error('Koneksi server Google Apps Script belum siap'));
    }
    google.script.run
      .withSuccessHandler(function(r){
        if(!silent)prog(false);
        if(r&&r.ok){ok(r.data)}
        else{
          var m=(r&&r.error)||'Terjadi kesalahan';
          if(m==='SESSION'){sessionEnd();no(new Error('Sesi berakhir, silakan masuk kembali'))}
          else no(new Error(m));
        }
      })
      .withFailureHandler(function(e){
        if(!silent)prog(false);
        no(new Error((e&&e.message)||'Gagal terhubung ke server'));
      })
      .api(a,pub?null:S.token,p||{});
  });
}

function confetti(){
  var cv=$('#fx');if(!cv)return;var ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  var cols=['#6B5BD6','#32B67A','#F06B9A','#F5B942','#4AA3DF'],ps=[];
  for(var i=0;i<60;i++)ps.push({x:cv.width/2+(Math.random()-.5)*180,y:cv.height*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,s:Math.random()*7+4,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6,vr:(Math.random()-.5)*.2});
  var f=0;
  (function step(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.38;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore()});
    if(++f<70)requestAnimationFrame(step);else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

var TB={};

  var o=TB[id]||{sort:-1,dir:1,page:0,size:10};

  var tot=r.length,pages=Math.max(1,Math.ceil(tot/T.size)),pg=r.slice(T.page*T.size,(T.page+1)*T.size);
  el.innerHTML='<div class="tw"><table><thead><tr>'+T.cols.map(function(c,i){return '<th '+(c.v?'onclick="tbSort(\''+id+'\','+i+')"':'')+'>'+esc(c.t)+(T.sort===i?(T.dir>0?' ▲':' ▼'):'')+'</th>'}).join('')+'</tr></thead>'+

/* ===================== DASHBOARD ===================== */
function normSt(s){return s==='Dikerjakan'?'On Progress':(s||'Belum Dikerjakan')}

function computeFilteredDash(raw, F, isInt){
  var q=String(F.q||'').toLowerCase().trim();
  var rows=(raw.rows||[]).map(function(j){return Object.assign({},j,{status:normSt(j.status)})}).filter(function(j){
    if(F.from && j.tgl<F.from)return false;
    if(F.to && j.tgl>F.to)return false;
    if(F.customer && j.custId!==F.customer)return false;
    if(F.leader && j.leader!==F.leader)return false;
    if(F.pengawas && j.pengawas!==F.pengawas)return false;
    if(F.status){
      if(F.status==='Outstanding'){if(j.status==='Selesai')return false}
      else if(F.status==='Urgent'){if(!j.urg)return false}
      else if(j.status!==F.status)return false;
    }
    if(q){
      var hay=[j.no,j.cust,j.pengawas,j.leader,j.kat,j.jenisKargo,j.jmlArmada,isInt?j.detail:''].join(' ').toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    return true;
  });

  var st={total:rows.length,selesai:0,belum:0,kerja:0,urgent:0,terlambat:0};
  var byC={};
  rows.forEach(function(j){
    if(j.status==='Selesai')st.selesai++;
    else if(j.status==='On Progress')st.kerja++;
    else st.belum++;
    if(j.urg==='URGENT')st.urgent++;
    if(j.urg==='TERLAMBAT')st.terlambat++;
    var b=byC[j.cust]||(byC[j.cust]={nama:j.cust,total:0,selesai:0});
    b.total++;if(j.status==='Selesai')b.selesai++;
  });
  st.outstanding=st.total-st.selesai;
  st.pct=st.total?Math.round(st.selesai/st.total*100):0;
  var customers=Object.keys(byC).map(function(k){return byC[k]}).sort(function(a,b){return b.total-a.total}).slice(0,8);

  var trend=[];
  for(var i=6;i>=0;i--){
    var dObj=new Date(Date.now()-i*86400000);
    var d=new Date(dObj.getTime()-dObj.getTimezoneOffset()*60000).toISOString().substr(0,10);
    trend.push({
      d:d,label:d.substr(8,2)+'/'+d.substr(5,2),
      masuk:rows.filter(function(j){return j.tgl===d}).length,
      selesai:rows.filter(function(j){return (j.selesai||'').substr(0,10)===d}).length
    });
  }
  var ids={};rows.forEach(function(r){ids[r.id]=1});
  var history=(raw.history||[]).filter(function(h){return !h.jobId||ids[h.jobId]}).slice(0,60);
  return {stats:st,customers:customers,trend:trend,rows:rows,history:history,opts:raw.opts||{customers:[],leaders:[],pengawas:[]}};
}

  var hasCache=!!S.cache[key];

function renderDashView(raw,mode,fromFilter){

  if(mode!=='pub'){S.alerts=raw.alerts||[];updateBell()}
  var F=S.f[mode]||{};
  fillOpts(raw.opts||{customers:[],leaders:[],pengawas:[]},F);
  var d=computeFilteredDash(raw,F,mode!=='pub');
  drawStats(d);
  drawCharts(d,fromFilter);
  drawJobs(d,mode);
  drawHist(d);
}

  '<div id="xres"></div>';

function loadXlsx(){
  if(window.XLSX)return Promise.resolve();
  if(S.xp)return S.xp;
  S.xp=new Promise(function(ok,no){
    var sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload=ok;sc.onerror=function(){S.xp=null;no(new Error('Library Excel gagal dimuat. Periksa koneksi internet Anda.'))};
    document.head.appendChild(sc);
  });
  return S.xp;
}
function xp2(n){return n<10?'0'+n:''+n}
function xDate(v,time){
  var y,mo,d,h=null,mi=null,m;
  if(typeof v==='number'&&isFinite(v)){
    var x=new Date(Math.round((v-25569)*1440)*6e4);
    y=x.getUTCFullYear();mo=x.getUTCMonth()+1;d=x.getUTCDate();h=x.getUTCHours();mi=x.getUTCMinutes();
  }else{
    var s=String(v==null?'':v).trim();if(!s)return '';
    if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T]+(\d{1,2})[:.](\d{2}))?/))){y=+m[1];mo=+m[2];d=+m[3];if(m[4]!=null){h=+m[4];mi=+m[5]}}
    else if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[ T,]+(\d{1,2})[:.](\d{2}))?/))){y=+m[3];if(y<100)y+=2000;mo=+m[2];d=+m[1];if(m[4]!=null){h=+m[4];mi=+m[5]}}
    else return s;
  }
  var out=y+'-'+xp2(mo)+'-'+xp2(d);
  if(time){if(h==null)return out;out+=' '+xp2(h)+':'+xp2(mi)}
  return out;
}
function xParse(buf){
  var wb=XLSX.read(buf,{type:'array'});
  var nm=wb.SheetNames.filter(function(n){return /^data/i.test(n)})[0]||wb.SheetNames[0];
  var aoa=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:true,defval:''});
  var hr=-1,map={},i;
  for(i=0;i<Math.min(15,aoa.length)&&hr<0;i++){
    var mp={},cnt=0;
    (aoa[i]||[]).forEach(function(h,ci){
      var k=String(h).toLowerCase().replace(/[^a-z0-9]/g,'');if(!k)return;
      for(var c=0;c<XCOLS.length;c++){
        if(mp[XCOLS[c][0]]===undefined&&XCOLS[c][2].test(k)){mp[XCOLS[c][0]]=ci;cnt++;break}
      }
    });
    if(cnt>=5){hr=i;map=mp}
  }

function noShort(r){var a=nosOf(r);return a.length>1?a[0]+' +'+(a.length-1):(a[0]||'-')}
function pbar(d,n){return '<div class="pbar"><i style="width:'+(n?Math.round(d/n*100):0)+'%"></i></div>'}
function ctnPill(r){return '<button type="button" class="ctb" onclick="openCtns(\''+r.id+'\')" title="Lihat daftar kontainer">'+(r.nDone||0)+'/'+(r.nCtn||1)+' Done</button>'}
function openCtns(id){

function drawCtns(id,d){

  '<div class="pg2" style="margin-top:12px"><small><span>Progres pekerjaan</span><b>'+d.done+' / '+d.n+' Done</b></small>'+pbar(d.done,d.n)+'</div>'+areaBoxHtml(d,edit)+
  (edit&&d.area&&left.length>1?'<div class="row" style="margin-top:10px"><button type="button" class="btn soft sm" id="ctall">Tandai semua Done</button></div>':'')+
  '<div class="ctl" id="ctl">'+d.ctns.map(function(c){

  }).join('')+'</div>'+
  (fin?'<div class="alert" style="margin:14px 0 0">'+ic('check')+'<div>Semua kontainer sudah Done. Lanjutkan dengan menandai pekerjaan <b>Selesai</b>.</div></div>':'')+

  var cl=$('#ctl');

function renderTasksView(raw){
  if(S.page!=='tasks'||!raw)return;
  S.alerts=raw.alerts||[];updateBell();
  S.rows={};
  var allRows=(raw.rows||[]).map(function(r){return Object.assign({},r,{status:normSt(r.status)})});
  allRows.forEach(function(r){S.rows[r.id]=r});
  var f=S.tf;
  var rows=allRows.filter(function(j){
    if(!f)return true;
    if(f==='Outstanding')return j.status!=='Selesai';
    if(f==='Urgent')return !!j.urg;
    return j.status===f;
  });
  var late=S.alerts.filter(function(a){return a.urg==='TERLAMBAT'}).length,td=S.alerts.length-late;
  $('#tal').innerHTML=S.alerts.length?'<div class="alert '+(late?'red':'')+'">'+ic('bell')+'<div>High Priority: <b>'+td+'</b> closing hari ini, <b>'+late+'</b> terlambat. Mohon diprioritaskan.</div></div>':'';
  $('#tjobs').innerHTML=rows.length?rows.map(function(r,i){return '<div class="job clk rv '+(r.urg==='URGENT'?'u1':r.urg==='TERLAMBAT'?'u2':'')+'" onclick="openTask(\''+r.id+'\')" style="--i:'+Math.min(i,8)+'"><h4><span>'+esc(noShort(r))+'</span>'+badge(r.status)+'</h4>'+
   '<p><b>'+esc(r.cust)+'</b> · '+esc(r.kat)+'</p>'+
   '<p>Armada: <b>'+esc(r.jmlArmada||'1')+'</b> ('+esc(r.uk)+') · Kargo: <b>'+esc(r.jenisKargo||'-')+'</b></p>'+
   '<div class="pg2"><small><span>Kontainer Done</span><b>'+(r.nDone||0)+' / '+(r.nCtn||1)+'</b></small>'+pbar(r.nDone||0,r.nCtn||1)+'</div>'+
   '<p>'+esc(r.detail)+'</p><p>Area: <b>'+esc(r.area||'Belum dipilih')+'</b></p><p>Closing: '+dt(r.close)+' '+urgB(r.urg)+'</p><p>Leader: '+esc(r.leader)+' · Checker: '+esc(r.checker||'-')+'</p>'+
   (r.hasil?'<p>Hasil: <b>'+esc(r.hasil)+'</b>'+(r.catatan?' — '+esc(r.catatan):'')+'</p>':'')+'<p style="font-size:12px">Ketuk kartu untuk memilih area (Phase 2/4/8) dan mencentang kontainer</p><button type="button" class="btn" onclick="event.stopPropagation();statusJob(\''+r.id+'\')">Update Status</button></div>'}).join(''):'<div class="card empty" style="grid-column:1/-1">Tidak ada tugas pada kategori ini.</div>';
}

function loadTasks(silent){
  swr('d:int','dashboard',{},false,function(raw){renderTasksView(raw)},silent).catch(function(e){if(!silent)toast(e.message,'err')});

/* ===================== GELEMBUNG LIVE CHAT CS ===================== */
var CH={
  open:false,ready:false,busy:false,
  id:store.getL('chid')||'',nama:store.getL('chnm')||'',seen:+(store.getL('chseen')||0),
  step:'',n:0,unread:0,cust:'',no:'',timer:0,
  staffRoom:null,staffRooms:[],staffSig:''
};
var NOCON=/^(?=.*\d)[A-Za-z0-9]{6,15}$/;

function isStaffMode(){return !!(S.user && S.page!=='pub' && S.page!=='login')}

function cwBind(){
  var cinp=$('#cinp'),cqr=$('#cqr');
  if(cinp)cinp.onkeydown=function(e){if(e.key==='Enter')cwSend()};
  if(cqr)cqr.onclick=function(e){
    var b=e.target.closest('.chip');if(!b||CH.busy)return;
    cwQR([]);var v=b.dataset.v;
    if(v==='skip'){
      cwAdd('out','Lewati','Anda');CH.step='msg';
      cwBot('Baik, tidak masalah 😊 Silakan tulis pertanyaan atau kendala yang ingin Anda sampaikan kepada CS kami.');
      $('#cinp').placeholder='Tulis pesan Anda...';
    }else{
      CH.cust=v.slice(2);cwAdd('out',b.textContent,'Anda');CH.step='cust';
      cwBot('Baik, customer '+b.textContent+' sudah dicatat. Ketik nomor container jika ada, atau langsung tulis pesan Anda di bawah.');
      $('#cinp').placeholder='Nomor container atau tulis pesan...';
    }
  };
}

function cwSyncMode(){
  var cw=$('#cw');if(!cw)return;
  var hideBubble=(S.page==='login' && !S.user);
  cw.style.display=hideBubble?'none':'block';
  if(hideBubble)return;

  if(isStaffMode()){
    $('#ctip').style.display='none';
    $('#cnew').style.display='none';
    if(CH.open){
      if(CH.staffRoom)cwOpenStaffRoom(CH.staffRoom);
      else cwRenderStaffList();
    }
    cwBadge();
  }else{
    $('#cback').style.display='none';
    $('#cinbar').style.display='flex';
    $('#cava').textContent='CS';
    $('#ctitle').textContent='Customer Service CDC';
    $('#cst').innerHTML='<i></i>Online · Respon Cepat';
    $('#cnew').style.display=CH.id?'grid':'none';
    $('#cdel').style.display='none';$('#ctiptxt').innerHTML='Halo, selamat '+sal()+'! Butuh bantuan? <b>Chat CS</b>';
    if(!CH.open)$('#ctip').style.display='flex';
    if(CH.open && !CH.ready)cwInitVisitor();
    cwBadge();
    if(CH.id && !CH.timer)cwLoop();
  }
}

function cwScroll(){var m=$('#cmsgs');if(m)m.scrollTop=m.scrollHeight}
function cwAdd(cls,text,who,pending){
  var d=document.createElement('div');d.className='cm '+cls;d.dataset.t=text;
  if(pending){d.dataset.p='1';d.classList.add('pend')}
  d.innerHTML=(who?'<small>'+esc(who)+'</small>':'')+esc(text);
  $('#cmsgs').appendChild(d);cwScroll();return d;
}
function cwBot(text){
  var t=document.createElement('div');t.className='cm in typing';t.innerHTML='<i></i><i></i><i></i>';
  $('#cmsgs').appendChild(t);cwScroll();
  return new Promise(function(r){setTimeout(r,450)}).then(function(){t.remove();cwAdd('in',text,'CS Crossdocking')});
}
function cwQR(items){
  var q=$('#cqr');if(!q)return;
  q.innerHTML=items.map(function(x,i){return '<button type="button" class="chip" style="--i:'+i+'" data-v="'+esc(x.v)+'">'+esc(x.t)+'</button>'}).join('');
  q.style.display=items.length?'flex':'none';
}
function cwBadge(){
  var b=$('#cbadge');if(!b)return;
  var n=isStaffMode()?(S.inboxUnread||0):CH.unread;
  b.style.display=n?'grid':'none';
  b.textContent=n;
}

function chatToggle(){
  CH.open=!CH.open;
  $('#cw').classList.toggle('open',CH.open);
  if(CH.open){
    $('#ctip').style.display='none';
    if(isStaffMode()){
      if(CH.staffRoom)cwOpenStaffRoom(CH.staffRoom);
      else cwRenderStaffList();
    }else{
      CH.unread=0;cwBadge();
      if(!CH.ready)cwInitVisitor();
      else cwScroll();
      setTimeout(function(){$('#cinp').focus()},300);
    }
  }
}

function cwNewChat(){
  store.delL('chid');
  CH.id='';CH.n=0;CH.seen=0;CH.ready=false;CH.step='';CH.cust='';CH.no='';
  clearTimeout(CH.timer);CH.timer=0;
  $('#cnew').style.display='none';
  cwInitVisitor();
}

function cwInitVisitor(){
  CH.ready=true;$('#cmsgs').innerHTML='';
  $('#cnew').style.display=CH.id?'grid':'none';
  var hi='Halo'+(CH.nama?', Kak '+CH.nama:'')+'! Selamat '+sal()+' 👋 Selamat datang di Live Chat Customer Service Crossdocking.';
  if(CH.id){
    cwBot(hi+' Percakapan Anda sebelumnya masih aktif. Silakan tulis pesan jika ada tambahan.').then(function(){
      CH.step='live';$('#cinp').placeholder='Tulis pesan...';
      call('chatPoll',{chatId:CH.id,after:0},true,true).then(cwApplyVisitor).catch(function(e){if(/CHAT_NOT_FOUND/.test(e.message))cwNewChat()});
      cwLoop();
    });
    return;
  }
  cwBot(hi+' Ada yang bisa kami bantu hari ini?').then(function(){
    return cwBot('Sebelum terhubung dengan petugas kami, boleh dibantu sebutkan nama Anda?');
  }).then(function(){
    CH.step='name';$('#cinp').placeholder='Ketik nama Anda...';
  });
}

function cwApplyVisitor(r){
  if(r.diteruskan && r.diteruskan.length){
    $('#cst').innerHTML='<i></i>Terhubung · '+esc(r.diteruskan.join(', '));
  }
  if(!CH.ready){
    CH.unread+=r.msgs.filter(function(m){return m.dari==='STAFF'}).length;
  }else{
    r.msgs.forEach(function(m){
      if(m.dari==='VISITOR'){
        var p=document.querySelector('#cmsgs .cm[data-p="1"]');
        if(p&&p.dataset.t===m.pesan){delete p.dataset.p;p.classList.remove('pend');return}
        cwAdd('out',m.pesan,'Anda');
      }else if(m.dari==='STAFF'){
        cwAdd('stf',m.pesan,m.pengirim);
        if(!CH.open)CH.unread++;
      }else{
        cwAdd('in',m.pesan,m.pengirim||'CS Crossdocking');
      }
    });
  }
  CH.n=r.n;CH.seen=r.n;store.setL('chseen',r.n);cwBadge();
}

function cwLoop(){
  clearTimeout(CH.timer);CH.timer=0;if(!CH.id)return;
  CH.timer=setTimeout(function(){
    CH.timer=0;
    if(document.hidden||isStaffMode())return cwLoop();
    call('chatPoll',{chatId:CH.id,after:CH.ready?CH.n:CH.seen},true,true).then(cwApplyVisitor).catch(function(e){if(/CHAT_NOT_FOUND/.test(e.message))cwNewChat()});
    cwLoop();
  },CH.open?4500:18000);
}

function cwSend(){
  if(CH.busy)return;
  var inp=$('#cinp'),text=inp.value.trim();if(!text)return;
  inp.value='';cwQR([]);

  if(isStaffMode()){
    if(!CH.staffRoom)return;
    var roomId=CH.staffRoom;
    var d=cwAdd('out',text,S.user.nama,true);
    call('chatReply',{id:roomId,pesan:text},false,true).then(function(){
      d.classList.remove('pend');inboxBg(true);
    }).catch(function(e){d.classList.remove('pend');d.classList.add('fail');toast(e.message,'err')});
    return;
  }

  var st=CH.step;
  if(st==='name'){
    cwAdd('out',text,'Anda');
    if(text.length<2){cwBot('Mohon maaf, nama minimal 2 karakter. Silakan ketik ulang nama Anda.');return}
    CH.nama=text.slice(0,60);store.setL('chnm',CH.nama);CH.step='cust';
    cwBot('Salam kenal, Kak '+CH.nama+'! 😊 Apakah pertanyaan ini terkait customer atau nomor container tertentu? Silakan pilih customer di bawah, ketik nomor container, atau klik Lewati.').then(function(){
      cwQR(((S.cfg&&S.cfg.customers)||[]).map(function(c){return {t:c.nama,v:'c:'+c.id}}).concat([{t:'Lewati →',v:'skip'}]));
      $('#cinp').placeholder='Nomor container atau tulis pesan...';
    });
    return;
  }
  if(st==='cust'&&NOCON.test(text.replace(/[\s-]/g,''))){
    cwAdd('out',text,'Anda');CH.no=text.toUpperCase();CH.step='msg';
    cwBot('Nomor container '+CH.no+' sudah dicatat. Silakan tulis pertanyaan atau detail kendala Anda.');
    $('#cinp').placeholder='Tulis pesan Anda...';return;
  }
  if(st==='cust'||st==='msg')return cwStartVisitor(text);
  if(st==='live'){
    var d2=cwAdd('out',text,'Anda',true);
    call('chatSend',{chatId:CH.id,pesan:text},true,true).then(function(){
      return call('chatPoll',{chatId:CH.id,after:CH.n},true,true);
    }).then(cwApplyVisitor).catch(function(e){d2.classList.remove('pend');d2.classList.add('fail');if(/CHAT_NOT_FOUND/.test(e.message)){toast('Percakapan telah ditutup petugas. Memulai percakapan baru.');cwNewChat()}else toast(e.message,'err')});
  }
}

function cwStartVisitor(text){
  CH.busy=true;var d=cwAdd('out',text,'Anda',true);
  call('chatStart',{nama:CH.nama,customerId:CH.cust,noContainer:CH.no,pesan:text},true,true).then(function(r){
    CH.id=r.chatId;store.setL('chid',CH.id);CH.step='live';CH.n=0;
    $('#cnew').style.display='grid';$('#cinp').placeholder='Tulis pesan...';
    return call('chatPoll',{chatId:CH.id,after:0},true,true);
  }).then(function(p){
    cwApplyVisitor(p);cwLoop();
  }).catch(function(e){
    d.classList.remove('pend');d.classList.add('fail');toast(e.message,'err');
  }).finally(function(){CH.busy=false});
}

function inboxApply(rows){
  CH.staffRooms=rows||[];
  var unr=CH.staffRooms.filter(function(r){return r.unread}).length;
  if(S.inboxInit && unr>(S.inboxUnread||0) && !CH.open){
    toast('💬 Pesan baru masuk di Live Chat CS!');
  }
  S.inboxUnread=unr;S.inboxInit=1;
  cwBadge();
  if(CH.open && isStaffMode() && !CH.staffRoom)cwRenderStaffList();
}

function inboxBg(){
  if(!S.user||document.hidden)return;
  call('chatInbox',{},false,true).then(function(rows){S.cache['inbox']=rows;inboxApply(rows)}).catch(function(){});
}

function cwRenderStaffList(){
  CH.staffRoom=null;
  $('#cback').style.display='none';
  $('#cnew').style.display='none';
  $('#cinbar').style.display='none';
  $('#cqr').style.display='none';
  $('#cava').textContent='CS';
  $('#ctitle').textContent='Live Chat Pengunjung';$('#cdel').style.display='none';
  var rows=CH.staffRooms||[];
  var unr=rows.filter(function(r){return r.unread}).length;
  $('#cst').innerHTML='<i></i>'+rows.length+' percakapan'+(unr?' · '+unr+' belum dibaca':'');
  var m=$('#cmsgs');
  if(!rows.length){
    m.innerHTML='<p class="empty">Belum ada percakapan masuk dari pengunjung publik.</p>';
    return;
  }
  m.innerHTML='<div class="crooms">'+rows.map(function(r,i){return '<div class="croom '+(r.unread?'unr':'')+'" style="--r:'+Math.min(i,10)+'" onclick="cwOpenStaffRoom(\''+r.id+'\')">'+
    '<div class="av">'+esc(r.nama.charAt(0).toUpperCase())+'</div>'+
    '<div class="rm-b">'+
      '<div class="rm-t"><b>'+esc(r.nama)+'</b><time>'+dt(r.diupdate).substr(5)+'</time></div>'+
      '<div class="rm-s">'+esc([r.cust,r.container].filter(Boolean).join(' · ')||'Umum')+'</div>'+
      '<div class="rm-m">'+esc(r.last)+'</div>'+
    '</div>'+
    '<button type="button" class="ib" style="width:30px;height:30px;box-shadow:none;background:var(--rose);color:var(--rose-i);flex:none" title="Hapus percakapan" aria-label="Hapus percakapan" onclick="event.stopPropagation();cwDelRoom(\''+r.id+'\')">'+ic('trash')+'</button>'+
    (r.unread?'<span class="udot"></span>':'')+
  '</div>'}).join('')+'</div>';
}

function cwDelRoom(id){
  id=id||CH.staffRoom;if(!id)return;
  var r=(CH.staffRooms||[]).filter(function(x){return x.id===id})[0]||{nama:'pengunjung'};
  modal('<h3>Hapus Percakapan?</h3><p>Percakapan dengan <b>'+esc(r.nama)+'</b> beserta seluruh pesannya akan dihapus permanen, juga bagi petugas lain yang terhubung. Tindakan ini tercatat di audit log.</p><div class="ma"><button type="button" class="btn soft" onclick="closeModal()">Batal</button><button type="button" class="btn red" id="cdok">Hapus</button></div>');
  $('#cdok').onclick=function(){
    busy($('#cdok'),function(){
      return call('chatDelete',{id:id}).then(function(rows){
        S.cache['inbox']=rows;
        if(CH.staffRoom===id){CH.staffRoom=null;CH.staffSig=''}
        inboxApply(rows);closeModal();cwRenderStaffList();toast('Percakapan dihapus');
      });
    });
  };
}
function cwStaffBack(){
  CH.staffRoom=null;CH.staffSig='';
  cwRenderStaffList();
  inboxBg(true);
}

function cwOpenStaffRoom(id){
  CH.staffRoom=id;
  var r=(CH.staffRooms||[]).filter(function(x){return x.id===id})[0]||{nama:'Pengunjung'};
  r.unread=false;cwBadge();
  $('#cback').style.display='grid';
  $('#cinbar').style.display='flex';
  $('#cava').textContent=r.nama.charAt(0).toUpperCase();
  $('#ctitle').textContent=r.nama;$('#cdel').style.display='grid';
  $('#cst').innerHTML='<i></i>'+esc([r.cust,r.container].filter(Boolean).join(' · ')||'Chat Langsung');
  $('#cinp').placeholder='Balas pesan '+r.nama+'...';
  $('#cmsgs').innerHTML='<p class="empty">Memuat percakapan...</p>';
  CH.staffSig='';
  cwLoadStaffThread(id).then(function(){$('#cinp').focus()});
}

function cwLoadStaffThread(id){
  if(!isStaffMode()||CH.staffRoom!==id)return Promise.resolve();
  return call('chatThread',{id:id},false,true).then(function(d){
    if(CH.staffRoom!==id)return;
    var sig=JSON.stringify(d.msgs);
    if(CH.staffSig===sig)return;
    CH.staffSig=sig;
    var m=$('#cmsgs');m.innerHTML='';
    d.msgs.forEach(function(x){
      var cls=x.dari==='VISITOR'?'in':x.dari==='STAFF'?'out':'stf';
      cwAdd(cls,x.pesan,x.pengirim+' · '+dt(x.waktu).substr(11));
    });
  }).catch(function(){});
}

/* ===================== ADMIN PAGES ===================== */
function pageUsers(){
  swr('m:Customers','masterList',{type:'Customers'},false,function(d){S.custAll=d},true).catch(function(){});
  $('#view').innerHTML='<div class="head row sb"><div><h1>Pengguna &amp; Role</h1><p class="sub">Buat akun Leader dan Pengawas, atur role dan customer Leader.</p></div><button type="button" class="btn" onclick="userForm()">'+ic('plus')+' Tambah Pengguna</button></div><div class="card"><div id="tb-users"></div></div>';
  loadUsers();
}
function loadUsers(){
  swr('users','userList',{},false,function(rows){
    if(S.page!=='users')return;
    S.us={};rows.forEach(function(r){S.us[r.id]=r});
    setTable('users',[
      {t:'Username',v:function(x){return x.username},h:function(x){return '<b>'+esc(x.username)+'</b>'}},
      {t:'Nama',v:function(x){return x.nama},h:function(x){return esc(x.nama)}},
      {t:'Role',v:function(x){return x.role},h:function(x){return esc(x.role)+(x.tipe?' · '+esc(x.tipe):'')}},
      {t:'Customer',h:function(x){return esc(x.customers||'-')}},
      {t:'Status',v:function(x){return x.aktif},h:function(x){return x.aktif==='Y'?'<span class="bdg b-Selesai">Aktif</span>':'<span class="bdg b-TERLAMBAT">Nonaktif</span>'}},
      {t:'Login Terakhir',v:function(x){return x.login},h:function(x){return dt(x.login)}},
      {t:'',h:function(x){return '<button type="button" class="btn soft sm" onclick="userForm(\''+x.id+'\')">Ubah</button>'}}
    ],rows);
  },true).catch(function(e){toast(e.message,'err')});
}
function userForm(id){
  var u=id?S.us[id]:{role:'PENGAWAS',aktif:'Y',customerIDs:[],tipe:'Project'};
  var custs=S.custAll||S.cache['m:Customers']||[];
  modal('<h3>'+(id?'Ubah':'Tambah')+' Pengguna</h3><div class="form">'+
  '<label class="f">Username<input id="uu" value="'+esc(u.username||'')+'" '+(id?'disabled':'')+' autocapitalize="none"></label><label class="f">Nama tampilan<input id="un" value="'+esc(u.nama||'')+'"></label>'+
  '<label class="f">Role<select id="ur">'+['LEADER','PENGAWAS','ADMIN'].map(function(r){return '<option '+(r===u.role?'selected':'')+'>'+r+'</option>'}).join('')+'</select></label>'+
  '<label class="f">Status<select id="ua"><option value="Y" '+(u.aktif==='Y'?'selected':'')+'>Aktif</option><option value="N" '+(u.aktif==='N'?'selected':'')+'>Nonaktif</option></select></label>'+
  '<label class="f w">'+(id?'Reset password (kosongkan jika tidak diubah)':'Password awal (min. 8, huruf & angka)')+'<input id="up" type="text" autocomplete="off"></label>'+
  '<div class="w" id="lw"><label class="f">Tipe Leader<select id="ut"><option '+(u.tipe==='Project'?'selected':'')+'>Project</option><option '+(u.tipe==='Non Project'?'selected':'')+'>Non Project</option></select></label>'+
   '<p class="mut" style="margin:10px 0 6px;font-weight:700">Customer yang boleh dipilih Leader</p><div class="ck">'+(custs.filter(function(c){return c.aktif==='Y'}).map(function(c){return '<label><input type="checkbox" value="'+esc(c.id)+'" '+((u.customerIDs||[]).indexOf(c.id)>=0?'checked':'')+'>'+esc(c.nama)+'</label>'}).join('')||'<span class="mut">Buat master customer terlebih dahulu.</span>')+'</div></div></div>'+
  '<div class="ma"><button type="button" class="btn soft" onclick="closeModal()">Batal</button><button type="button" class="btn" id="uok">Simpan</button></div>');
  var t=function(){$('#lw').style.display=$('#ur').value==='LEADER'?'block':'none'};$('#ur').onchange=t;t();
  $('#uok').onclick=function(){
    busy($('#uok'),function(){
      var checked=[].slice.call(document.querySelectorAll('#lw .ck input:checked')).map(function(i){return i.value});
      return call('userSave',{id:id||'',username:$('#uu').value,nama:$('#un').value,role:$('#ur').value,aktif:$('#ua').value,password:$('#up').value,tipe:$('#ut').value,customerIDs:checked}).then(function(r){
        if(r&&r.users){S.cache['users']=r.users;if(r.fd)S.fd=r.fd;saveSnap()}
        closeModal();toast('Pengguna tersimpan');loadUsers();
      });

}

function pageMaster(type){
  var cu=type==='Customers';
  $('#view').innerHTML='<div class="head row sb"><div><h1>Master '+(cu?'Customer':'Checker')+'</h1><p class="sub">'+(cu?'Atur customer dan apakah ditampilkan di dashboard publik.':'Daftar checker yang dapat dipilih Leader.')+'</p></div><button type="button" class="btn" onclick="masterForm(\''+type+'\')">'+ic('plus')+' Tambah</button></div><div class="card"><div id="tb-m"></div></div>';
  loadMaster(type);
}
function loadMaster(type){
  swr('m:'+type,'masterList',{type:type},false,function(rows){
    if(S.page!==(type==='Customers'?'customers':'checkers'))return;
    S.ms={};rows.forEach(function(r){S.ms[r.id]=r});var cu=type==='Customers';
    if(cu)S.custAll=rows;
    setTable('m',[{t:'ID',v:function(x){return x.id},h:function(x){return esc(x.id)}},{t:'Nama',v:function(x){return x.nama},h:function(x){return '<b>'+esc(x.nama)+'</b>'}}].concat(cu?[{t:'Dashboard Publik',v:function(x){return x.tampilPublik},h:function(x){return x.tampilPublik==='Y'?'<span class="bdg b-Selesai">Tampil</span>':'<span class="bdg b-Belum">Disembunyikan</span>'}}]:[]).concat([{t:'Status',v:function(x){return x.aktif},h:function(x){return x.aktif==='Y'?'Aktif':'Nonaktif'}},{t:'',h:function(x){return '<button type="button" class="btn soft sm" onclick="masterForm(\''+type+'\',\''+x.id+'\')">Ubah</button>'}}]),rows);
  },true).catch(function(e){toast(e.message,'err')});
}
function masterForm(type,id){
  var m=id?S.ms[id]:{aktif:'Y',tampilPublik:'Y'},cu=type==='Customers';
  modal('<h3>'+(id?'Ubah':'Tambah')+' '+(cu?'Customer':'Checker')+'</h3><div class="form"><label class="f w">Nama<input id="mn" value="'+esc(m.nama||'')+'"></label>'+
  (cu?'<label class="f">Dashboard Publik<select id="mp"><option value="Y" '+(m.tampilPublik==='Y'?'selected':'')+'>Tampilkan</option><option value="N" '+(m.tampilPublik==='N'?'selected':'')+'>Sembunyikan</option></select></label>':'')+
  '<label class="f">Status<select id="ma"><option value="Y" '+(m.aktif==='Y'?'selected':'')+'>Aktif</option><option value="N" '+(m.aktif==='N'?'selected':'')+'>Nonaktif</option></select></label></div>'+
  '<div class="ma"><button type="button" class="btn soft" onclick="closeModal()">Batal</button><button type="button" class="btn" id="mok">Simpan</button></div>');
  $('#mok').onclick=function(){
    busy($('#mok'),function(){
      return call('masterSave',{type:type,id:id||'',nama:$('#mn').value,aktif:$('#ma').value,tampilPublik:cu?$('#mp').value:''}).then(function(r){
        if(r&&r.list){S.cache['m:'+type]=r.list;if(r.cfg)S.cfg=r.cfg;if(r.fd)S.fd=r.fd;saveSnap()}
        closeModal();toast('Data tersimpan');loadMaster(type);
      });
    });
  };
}

/* ===================== BOOT INIT ===================== */
(function initApp(){
  $('#modal').addEventListener('mousedown',function(e){if(e.target.id==='modal')closeModal()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});

  cwBind();
  if(S.user)go(home());
  else cwSyncMode();

  call('cfg',{},true,true).then(function(c){if(c){S.cfg=c;saveSnap()}}).catch(function(){});
  swr('d:pub','dashboard',{},true,function(){},true).catch(function(){});

  if(S.token){
    call('me',{},false,true).then(function(b){
      var hadUser=!!S.user;
      applyBundle(b);
      shell();cwSyncMode();
      if(!hadUser)go(home());
      else if(S.page==='dash')renderDashView(S.cache['d:int'],'int',true);
      else if(S.page==='tasks')renderTasksView(S.cache['d:int']);
    }).catch(function(){sessionEnd()});
  }

  setInterval(function(){if(S.refresh&&!document.hidden&&!$('#modal').classList.contains('on'))S.refresh(true)},25000);
  setInterval(function(){if(CH.open && isStaffMode() && CH.staffRoom && !document.hidden)cwLoadStaffThread(CH.staffRoom)},4500);
  setInterval(function(){inboxBg()},20000);
})();
</script>
